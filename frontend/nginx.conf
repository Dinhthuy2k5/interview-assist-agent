server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bật gzip compression - giảm bandwidth đáng kể cho VPS 0.5Gbps
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets lâu dài (tên file đã có hash bởi Vite)
    location ~* \.(js|css|woff2?|ico|png|svg|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: mọi route không khớp file thật → trả về index.html
    # để React Router xử lý client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tắt access log cho assets tĩnh để giảm disk write trên block storage
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
