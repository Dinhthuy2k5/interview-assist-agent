[project]
name = "interview-assist-agent-backend"
version = "0.1.0"
description = "Backend cho Interview Assist Agent (đề tài 113 / BO-17)"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.1",
    "anthropic>=0.34",
    "groq>=0.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "boto3>=1.34",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "reportlab>=4.2",
]
# faster-whisper kéo theo ctranslate2 (nặng) - tách riêng để pip install -e .
# (dev/test hàng ngày) không phải cài/tải package này. Cần cho production:
# pip install -e .[stt]
stt = [
    "faster-whisper>=1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI dùng Depends()/Form()/File() làm default argument - pattern chuẩn, không phải bug

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"